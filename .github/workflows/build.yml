name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container:
      # Pinned by digest; update it together with the tag when bumping Godot
      image: barichello/godot-ci:4.7.2@sha256:cdcca31e9194fd59a68a63f4b1b9c3981716819c520cd6f7966c5d72ca7246bd
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux
            dir: linux
            artifact: game-jam-2-linux
          - preset: Windows Desktop
            dir: windows
            artifact: game-jam-2-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable || true

      - name: Import project
        run: godot --headless --import

      - name: Export (production build, no developer mode)
        run: |
          mkdir -p build/${{ matrix.dir }}
          bash tools/build.sh --production "${{ matrix.preset }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.dir }}
          retention-days: 30

  release:
    name: Publish rolling "latest" release
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes to main must not update the release at the same time
    concurrency:
      group: release-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir dist
          # upload-artifact drops the exec bit, so restore it and use tar.gz for Linux
          chmod +x artifacts/game-jam-2-linux/game-jam-2.x86_64
          tar -czf dist/game-jam-2-linux.tar.gz -C artifacts/game-jam-2-linux .
          (cd artifacts/game-jam-2-windows && zip -r ../../dist/game-jam-2-windows.zip .)

      - name: Update latest release in place
        # Never delete the release first: if any step fails, the previous build stays downloadable.
        run: |
          title="Latest build (${GITHUB_SHA::7})"
          notes="Automatic build of \`main\` at ${GITHUB_SHA}."
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true --silent
            gh release edit latest --title "$title" --notes "$notes" --prerelease
          else
            gh release create latest dist/* --target "${GITHUB_SHA}" --title "$title" --notes "$notes" --prerelease
          fi
