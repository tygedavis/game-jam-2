name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: GDScript lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"

      - name: Lint (rules in gdlintrc)
        run: gdlint scripts tests

  export-presets-guard:
    name: export_presets.cfg has no secrets or local paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: bash tools/check_export_presets.sh

  load-check:
    name: Project loads
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Import project
        run: godot --headless --import

      - name: Load project headlessly
        # pipefail keeps Godot's exit code through the tee
        shell: bash -o pipefail {0}
        run: |
          godot --headless --quit 2>&1 | tee load.log
          # Fail on script parse errors, missing resources or any other engine error
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" load.log

  tests:
    name: Headless tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Import project
        run: godot --headless --import

      - name: Test runner self-test
        run: bash tests/runner_selftest.sh

      - name: Run tests
        run: bash tests/run_all.sh

  export-smoke:
    name: Linux export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable || true

      - name: Import project
        run: godot --headless --import

      - name: Export (production build, no developer mode)
        run: |
          mkdir -p build/linux
          bash tools/build.sh --production "Linux"
          test -s build/linux/game-jam-2.x86_64

      - name: Check the production build leaves out the developer mode
        run: bash tests/production_build_check.sh

      - name: Launch the production build
        # Starts the exported game without scripts/dev/ and fails on any engine error
        shell: bash -o pipefail {0}
        run: |
          chmod +x build/linux/game-jam-2.x86_64
          build/linux/game-jam-2.x86_64 --headless --quit-after 5 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" run.log
